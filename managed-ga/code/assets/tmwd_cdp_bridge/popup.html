<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
body{width:320px;margin:0;padding:10px;font:12px monospace;background:#1e1e1e;color:#d4d4d4}
h3{margin:0 0 8px;color:#569cd6}
#status{display:flex;align-items:center;gap:6px;margin-bottom:4px}
#dot{width:8px;height:8px;border-radius:50%;background:#666}
#dot.on{background:#4CAF50}
#tabs{color:#9a9a9a;margin-bottom:10px}
button{background:#264f78;color:#fff;border:none;padding:4px 12px;cursor:pointer;border-radius:3px;margin-bottom:6px}
button:hover{background:#37699e}
pre{white-space:pre-wrap;word-break:break-all;margin:0;padding:6px;background:#252526;border-radius:3px;max-height:300px;overflow-y:auto;display:none}
pre.show{display:block}
</style>
</head>
<body>
<h3>Galley Browser Bridge</h3>
<div id="status"><span id="dot"></span><span id="statusText">检测中…</span></div>
<div id="tabs"></div>
<button id="copyCookies">复制当前站点 Cookies</button>
<pre id="out"></pre>
<script src="popup.js"></script>
</body>
</html>
