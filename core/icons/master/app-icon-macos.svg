<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- macOS (icon.icns): the master on Apple's icon grid. An 824 x 824
       continuous-corner square centred on the 1024 canvas (100px gutters),
       corner radius 185.4, drawn with Figma's corner smoothing at 60%
       (each corner runs 1.6 r along its edges: two cubics around a circular
